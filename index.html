<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>3D Model</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); overflow: hidden; }
    .sitcom-3d-container { text-align: center; color: white; padding: 20px; font-family: sans-serif; }
    .sitcom-3d-title { font-size: 22px; font-weight: 800; color: #ffd700; margin: 0 0 5px 0; }
    .sitcom-3d-desc { font-size: 14px; color: #e2e8f0; margin: 0 0 20px 0; }
    #sitcom-coin-viewer { width: 100vw; height: 75vh; background-color: transparent; cursor: grab; outline: none; }
    #sitcom-coin-viewer:active { cursor: grabbing; }
    .sitcom-3d-footer { text-align: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 13px; color: #a0aec0; }
  </style>
</head>
<body>

<div class="sitcom-3d-container">
  <h3 class="sitcom-3d-title">🎬 情境喜劇限定：3D 虛擬粉絲紀念章</h3>
  <p class="sitcom-3d-desc">期末實作成果：將 Blender 3D 動態模型無縫嵌入 WordPress 行銷網頁</p>

  <model-viewer 
    id="sitcom-coin-viewer"
    src="B%E7%A1%AC%E5%B9%A3.glb" 
    autoplay
    camera-controls 
    auto-rotate 
    shadow-intensity="1.2"
    exposure="1.1"
    environment-image="neutral"
    alt="Sitcom 3D Coin Asset">
  </model-viewer>

  <div class="sitcom-3d-footer">
    <span>💡 互動指南：可用滑鼠拖曳旋轉、滾輪縮放，體驗 3D 圓柱體動畫細節</span>
  </div>
</div>

</body>
</html>
